<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jewellery Configurator | Configurator</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="d-flex flex-column" style="min-height: 100vh">
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div
          class="header d-flex w-100 justify-content-between align-items-center">
          <a class="navbar-brand" href="/"
            ><i class="fa-solid fa-gem"></i>Jewellery Configurator</a
          >
          <a href="./cart.html" class="position-relative ml-auto">
            <i class="fa-solid fa-cart-shopping"></i>
            <span
              id="cart-badge"
              class="badge badge-pill badge-danger position-absolute"
              style="
                top: -8px;
                right: -12px;
                min-width: 22px;
                font-size: 0.9em;
                background: #dc3545;
                color: #fff;
                display: inline-block;
                text-align: center;
              "></span>
          </a>
        </div>
      </nav>
    </header>
    <div class="page flex-grow-1">
      <div
        class="container-fluid flex-grow-1 d-flex align-items-center justify-content-center"
        style="flex: 1">
        <div class="row w-100 align-items-start justify-content-center">
          <div
            class="col-lg-7 col-12 d-flex justify-content-center mb-4 mb-lg-0">
            <canvas id="renderCanvas"></canvas>
          </div>
          <div class="col-lg-5 col-12 d-flex flex-column align-items-stretch">
            <div class="menu-container p-3 bg-white rounded shadow-sm mb-3">
              <div class="column-config mb-4"></div>
              <div class="purchase-section">
                <div class="d-flex align-items-center mb-3">
                  <label for="quantity" class="mr-2 font-weight-bold"
                    >Quantità:</label
                  >
                  <input
                    type="number"
                    id="quantity"
                    min="1"
                    value="1"
                    class="form-control quantity-input"
                    style="width: 80px" />
                </div>
                <div class="d-flex align-items-center mb-3">
                  <span class="font-weight-bold mr-2">Prezzo:</span>
                  <span id="product-price" class="h5 mb-0 text-success"
                    >€99</span
                  >
                </div>
                <div id="addToCartBtn" class="btn btn-primary btn-lg w-100">
                  <i class="fa fa-cart-plus mr-2"></i>Aggiungi al carrello
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="bg-light py-3 mt-auto">
      <div
        class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <span class="text-muted mb-2 mb-md-0"
          >&copy; 2025 Jewellery Configurator</span
        >
        <div>
          <a
            href="https://facebook.com"
            class="text-muted mx-2"
            target="_blank"
            rel="noopener">
            <i class="fab fa-facebook fa-lg"></i>
          </a>
          <a
            href="https://instagram.com"
            class="text-muted mx-2"
            target="_blank"
            rel="noopener">
            <i class="fab fa-instagram fa-lg"></i>
          </a>
          <a href="mailto:info@example.com" class="text-muted mx-2">
            <i class="fas fa-envelope fa-lg"></i>
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="./scripts/cart.js"></script>
    <script type="module" src="./scripts/config.js"></script>
    <script type="module" src="./scripts/scene.js"></script>
  </body>
</html>
