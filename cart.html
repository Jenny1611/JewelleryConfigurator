<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jewellery Configurator | Cart</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles-cart.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div
          class="header d-flex w-100 justify-content-between align-items-center">
          <a class="navbar-brand" href="/"
            ><i class="fa-solid fa-gem"></i>Jewellery Configurator</a
          >
          <a href="./cart.html" class="position-relative ml-auto">
            <i class="fa-solid fa-cart-shopping"></i>
            <span
              id="cart-badge"
              class="badge badge-pill badge-danger position-absolute"
              style="
                top: -8px;
                right: -12px;
                min-width: 22px;
                font-size: 0.9em;
                background: #dc3545;
                color: #fff;
                display: inline-block;
                text-align: center;
              "></span>
          </a>
        </div>
      </nav>
    </header>
    <div class="cart" id="cart"></div>
    <footer class="bg-dark py-3 mt-auto">
      <div
        class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <span class="text-muted mb-2 mb-md-0"
          >&copy; 2025 Jewellery Configurator</span
        >
        <div>
          <a
            href="https://facebook.com"
            class="text-muted mx-2"
            target="_blank"
            rel="noopener">
            <i class="fab fa-facebook fa-lg"></i>
          </a>
          <a
            href="https://instagram.com"
            class="text-muted mx-2"
            target="_blank"
            rel="noopener">
            <i class="fab fa-instagram fa-lg"></i>
          </a>
          <a href="mailto:info@example.com" class="text-muted mx-2">
            <i class="fas fa-envelope fa-lg"></i>
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="./scripts/cart.js"></script>
  </body>
</html>
