<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jewellery Configurator | Home</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles-index.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div
          class="header d-flex w-100 justify-content-between align-items-center">
          <a class="navbar-brand" href="/"
            ><i class="fa-solid fa-gem"></i>Jewellery Configurator</a
          >
          <a href="./cart.html" class="position-relative ml-auto">
            <i class="fa-solid fa-cart-shopping"></i>
            <span
              id="cart-badge"
              class="badge badge-pill badge-danger position-absolute"></span>
          </a>
        </div>
      </nav>
    </header>
    <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center"
    id="section1"></div>
    <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center"
    id="section2"></div>
    <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center"
    id="section3"></div>
    <footer class="bg-dark py-3 mt-auto">
      <div
        class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <span class="text-muted mb-2 mb-md-0"
          >&copy; 2025 Jewellery Configurator</span
        >
        <div>
          <a
            href="https://facebook.com"
            class="text-muted mx-2"
            target="_blank"
            rel="noopener">
            <i class="fab fa-facebook fa-lg"></i>
          </a>
          <a
            href="https://instagram.com"
            class="text-muted mx-2"
            target="_blank"
            rel="noopener">
            <i class="fab fa-instagram fa-lg"></i>
          </a>
          <a href="mailto:info@example.com" class="text-muted mx-2">
            <i class="fas fa-envelope fa-lg"></i>
          </a>
        </div>
      </div>
    </footer>
    <script type="module">
      const sections = {
        'section1': [
          './models/r1.js',
          './models/r2.js',
          './models/r3.js',
          ],
        'section2': [
          './models/b1.js',
          './models/b2.js',
          './models/b3.js',
          ],
        'section3': [
          './models/n1.js',
          './models/n2.js',
          './models/n3.js'
          ],
      }

      async function loadModels() {
        const models = {};
        for (const section in sections) {
          models[section] = [];
          for (const file of sections[section]) {
            const mod = await import(file);
            models[section].push(mod.model.info);
          }
        }
        return models;
      }

      function createCard(model) {
        return `
          <div class="col d-flex align-items-stretch">
            <div class="card h-100 w-100 text-center">
              <img
                src="${model.img}"
                class="card-img-top"
                alt="${model.name}"
                style="object-fit: cover; height: 220px" />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${model.name}</h5>
                <p class="card-text flex-grow-1">${model.description}</p>
                <div class="mb-2"><strong>€${model.price.toFixed(2)}</strong></div>
                <a
                  class="btn btn-outline-primary mt-auto load-model"
                  id="${model.id}"
                  href="./configurator.html?model=${model.id}"
                  >Configura</a
                >
              </div>
            </div>
          </div>
        `;
      }

      async function renderModels() {
        const sections = await loadModels();
          for (const section in sections) {
            const container = document.getElementById(section);
            let html = `<div class="row row-cols-1 row-cols-md-3 g-4 w-100">`;
            const models = sections[section];
            for (const model of models) {
              html += createCard(model);
            }
            html += `</div>`;
            container.innerHTML = html;
          }
      }

      renderModels();
    </script>
  </body>
</html>
